<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Express Option - Verify Withdrawal</title>
  <style>
    /* === Global Styles === */
    :root{
      --bg-1:#000;
      --bg-2:#1a1a1a;
      --card:#111;
      --orange:#ffa500;
      --orange-dark:#ff8c00;
      --muted:#ccc;
      --input-bg:#222;
    }
    html,body{height:100%;margin:0;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,var(--bg-1),var(--bg-2));color:#fff}
    .center-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box;
    }

    .container {
      background: rgba(17,17,17,0.98);
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(255,140,0,0.15);
      text-align: center;
      width: 380px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .container:hover{ transform: translateY(-6px); box-shadow:0 18px 50px rgba(255,140,0,0.22) }

    .logo{ font-size:20px; font-weight:700; color:var(--orange); margin-bottom:12px; letter-spacing:1px }
    .logo .highlight{ color:#fff }

    h1{ color:var(--orange); font-size:22px; margin:6px 0 10px }
    p{ color:var(--muted); margin:0 0 22px; font-size:15px; line-height:1.4 }

    .input-wrap{ margin-bottom:12px }
    .input-wrap input{
      width:80%;
      padding:12px;
      border-radius:10px;
      border:2px solid var(--orange);
      background:var(--input-bg);
      color:#fff;
      outline:none;
      font-size:15px;
      text-align:center;
      box-sizing:border-box;
    }
    .input-wrap input:focus{ box-shadow:0 0 8px rgba(255,140,0,0.28); border-color:var(--orange-dark) }

    .actions{ margin-top:6px }
    button.primary{
      padding:12px 26px;
      border-radius:10px;
      border:0;
      background:var(--orange);
      color:#000;
      font-weight:700;
      cursor:pointer;
      font-size:15px;
    }
    button.primary:hover{ background:var(--orange-dark) }
    button.primary[type="submit"]{ /* safety - not used here */ }

    .message{
      margin-top:18px;
      min-height:28px;
      font-weight:700;
      font-size:15px;
    }
    .message.success{ color:#00ff66 }
    .message.fail{ color:#ff6b6b }

    /* Loader */
    .loader{
      display:inline-block;
      width:22px;
      height:22px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,0.12);
      border-top-color:var(--orange);
      animation:spin 0.9s linear infinite;
      vertical-align:middle;
      margin-right:8px;
    }
    @keyframes spin{ to{ transform:rotate(360deg) } }

    /* === Live Chat === */
    .chat-icon{
      position:fixed;
      right:28px;
      bottom:28px;
      width:62px;
      height:62px;
      border-radius:50%;
      background:var(--orange);
      color:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      cursor:pointer;
      box-shadow:0 8px 30px rgba(255,165,0,0.25);
      z-index:9999;
    }
    .chat-box{
      position:fixed;
      right:28px;
      bottom:100px;
      width:320px;
      max-width:calc(100% - 56px);
      background:var(--card);
      border:2px solid var(--orange);
      border-radius:12px;
      display:none; /* toggled to flex in JS */
      flex-direction:column;
      overflow:hidden;
      box-shadow:0 18px 60px rgba(255,140,0,0.18);
      z-index:9999;
    }
    .chat-header{
      background:var(--orange);
      color:#000;
      padding:10px 12px;
      font-weight:700;
      position:relative;
      text-align:center;
    }
    .chat-close{
      position:absolute;
      right:8px;
      top:6px;
      background:none;
      border:0;
      font-size:18px;
      cursor:pointer;
    }
    .chat-body{
      padding:12px;
      height:220px;
      overflow:auto;
      display:flex;
      flex-direction:column;
      gap:10px;
      color:#fff;
      background:linear-gradient(180deg,#0f0f0f,#181818);
    }
    .msg{ background:#222; padding:8px 10px; border-radius:8px; max-width:78%; word-wrap:break-word; font-size:14px }
    .msg.user{ background:var(--orange); color:#000; align-self:flex-end }
    .chat-footer{ display:flex; gap:6px; border-top:1px solid rgba(255,165,0,0.08) }
    .chat-footer input{
      flex:1; padding:12px; border:0; outline:none; background:#191919; color:#fff; font-size:14px
    }
    .chat-footer button{ padding:0 14px; background:var(--orange); border:0; color:#000; cursor:pointer; font-weight:700 }

    /* small screens adjust */
    @media (max-width:420px){
      .container{ width:92% }
      .chat-body{ height:180px }
    }
  </style>
</head>
<body>
  <div class="center-wrap">
    <div class="container" role="main" aria-labelledby="pageTitle">
      <div class="logo">Express <span class="highlight">Option</span></div>
      <h1 id="pageTitle">Withdrawal Successful</h1>
      <p>Your withdrawal has been approved.<br>Please verify your identity with the OTP code below.</p>

      <div class="input-wrap">
        <input id="codeInput" name="otp" type="password" inputmode="numeric" placeholder="Enter OTP code" aria-label="OTP code" />
      </div>

      <div class="actions">
        <!-- type="button" prevents accidental form submit behavior in some contexts -->
        <button id="verifyBtn" class="primary" type="button">Verify</button>
      </div>

      <div id="message" class="message" aria-live="polite"></div>
    </div>
  </div>

  <!-- chat icon -->
  <div id="chatIcon" class="chat-icon" title="Open chat">💬</div>

  <!-- chat box -->
  <div id="chatBox" class="chat-box" role="dialog" aria-label="Live chat with Steeve">
    <div class="chat-header">
      Chat with Steeve
      <button id="chatClose" class="chat-close" aria-label="Close chat">×</button>
    </div>
    <div id="chatBody" class="chat-body" aria-live="polite">
      <div class="msg">👋 Hello! How can I help you today?</div>
    </div>

    <div class="chat-footer">
      <input id="chatInput" type="text" placeholder="Type a message..." aria-label="Type a message">
      <button id="chatSend" type="button">Send</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Elements
      const verifyBtn = document.getElementById('verifyBtn');
      const codeInput = document.getElementById('codeInput');
      const messageEl = document.getElementById('message');

      const chatIcon = document.getElementById('chatIcon');
      const chatBox = document.getElementById('chatBox');
      const chatClose = document.getElementById('chatClose');
      const chatBody = document.getElementById('chatBody');
      const chatInput = document.getElementById('chatInput');
      const chatSend = document.getElementById('chatSend');

      // Correct OTP
      const CORRECT_CODE = '5675';

      // Attach click handler for Verify button (robust)
      verifyBtn.addEventListener('click', function () {
        // read trimmed value
        const val = (codeInput.value || '').trim();

        // show loader + processing text
        messageEl.innerHTML = '<span class="loader" aria-hidden="true"></span><span>Processing...</span>';
        messageEl.className = 'message';

        // short delay to simulate processing (2s)
        setTimeout(() => {
          if (val === CORRECT_CODE) {
            messageEl.textContent = '✅ Successful! You will receive your fund within 10 minutes.';
            messageEl.className = 'message success';
          } else {
            messageEl.textContent = '❌ Failed! Incorrect code.';
            messageEl.className = 'message fail';
          }
        }, 2000);
      });

      // Allow Enter key within the OTP input to trigger verification
      codeInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          verifyBtn.click();
        }
      });

      /* === Chat behavior === */
      function openChat(){
        chatBox.style.display = 'flex';
        // ensure direction column layout
        chatBox.style.flexDirection = 'column';
        chatInput.focus();
      }
      function closeChat(){
        chatBox.style.display = 'none';
      }

      chatIcon.addEventListener('click', function () {
        if (chatBox.style.display === 'flex') closeChat(); else openChat();
      });
      chatClose.addEventListener('click', closeChat);

      // send chat message
      function appendUserMessage(text){
        const d = document.createElement('div');
        d.className = 'msg user';
        d.textContent = text;
        chatBody.appendChild(d);
        chatBody.scrollTop = chatBody.scrollHeight;
      }
      function appendBotMessage(text){
        const d = document.createElement('div');
        d.className = 'msg';
        d.textContent = text;
        chatBody.appendChild(d);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      chatSend.addEventListener('click', function(){
        const text = (chatInput.value || '').trim();
        if (!text) return;
        appendUserMessage(text);
        chatInput.value = '';
        // simple auto-reply
        setTimeout(() => {
          appendBotMessage('Steeve: Thanks — I\'ll assist you shortly.');
        }, 800);
      });

      // allow Enter key in chat input
      chatInput.addEventListener('keydown', function(e){
        if (e.key === 'Enter') {
          e.preventDefault();
          chatSend.click();
        }
      });

      // Accessibility: close chat with Escape
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && chatBox.style.display === 'flex') closeChat();
      });
    });
  </script>
</body>
</html>
